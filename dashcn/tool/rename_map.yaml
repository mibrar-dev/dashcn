# P8-2 rename map: every `shadcn` identifier / string / file name in the kit +
# docs app and its plain replacement.
#
# Sources: `DASHCN_PACKAGE_PLAN.md` §2 (status `table`), `DASHCN_FEATURES_PLAN.md`
# §0 (`ShadcnApp` → `DashcnApp`, status `table`), and the analyzer inventory
# `rearch/plans/api_inventory.json` (`tool/rename_inventory.dart`).
# Entries with `proposed: true` are NOT in the §2 table and need orchestrator
# approval before `tool/rename_api.dart` runs.
#
# Clash check (2026-10-12, P8-2 agent): every `to:` name was grepped against
# the local Flutter SDK's `package:flutter/widgets.dart` transitive exports
# (classes, mixins, enums, extensions, typedefs, top-level functions) — zero
# hits. `tool/check_names.dart` re-verifies this mechanically.
version: 1

# Exact identifier renames (declarations + all references, any scope).
identifiers:
  # §2 table (ShadcnApp row overridden by FEATURES §0: DashcnApp).
  - { from: ShadcnApp, to: DashcnApp }
  - { from: ShadcnTheme, to: Theme }
  - { from: ShadcnThemeData, to: ThemeData }
  - { from: ShadcnThemeDataTween, to: ThemeDataTween }
  - { from: ShadcnColors, to: ThemeColors }
  - { from: ShadcnFonts, to: ThemeFonts }
  - { from: ShadcnTokens, to: DesignTokens }
  - { from: ShadcnForm, to: FormScope }
  - { from: ShadcnFormField, to: FormItem }
  - { from: ShadcnImage, to: Picture }
  - { from: ShadcnRadioGroup, to: RadioSet }
  - { from: ShadcnRadioGroupController, to: RadioSetController }
  - { from: ShadcnPage, to: AppPage }
  - { from: ShadcnPageRoute, to: AppPageRoute }
  - { from: ShadcnPageTransition, to: AppPageTransition }
  - { from: ShadcnDialogRoute, to: DialogRoute }
  - { from: ShadcnDrawerRoute, to: DrawerRoute }
  - { from: ShadcnLayer, to: AppLayer }
  - { from: ShadcnLocalizations, to: ComponentLocalizations }
  - { from: ShadcnSelectionControls, to: SelectionControls }
  - { from: ShadcnTextSelectionToolbar, to: SelectionToolbar }
  - { from: showShadcnDialog, to: showDialog }
  - { from: showShadcnPopup, to: showPopup }
  - { from: showShadcnMenu, to: showMenu }
  - { from: showShadcnDropdown, to: showDropdown }
  - { from: showShadcnContextMenu, to: showContextMenu }
  # Inventory additions (all `proposed: true`).
  - from: AnimatedShadcnTheme
    to: AnimatedTheme
    proposed: true
    note: Public widget in lib/src/theme/theme.dart (42 refs); table misses it.
  - from: _AnimatedShadcnThemeState
    to: _AnimatedThemeState
    proposed: true
  - from: _ShadcnImageState
    to: _PictureState
    proposed: true
  - from: _ShadcnLocalizationsDelegate
    to: _ComponentLocalizationsDelegate
    proposed: true
  - from: lookupShadcnLocalizations
    to: lookupComponentLocalizations
    proposed: true
  - from: hasShadcnLocalizations
    to: hasComponentLocalizations
    proposed: true
    note: Test-local bool in test/registry/components/app_test.dart.
  - from: defaultShadcnContextMenuBuilder
    to: defaultContextMenuBuilder
    proposed: true
  - from: kShadcnPageTransitionDuration
    to: kPageTransitionDuration
    proposed: true
  - from: kShadcnContextMenuTypes
    to: kContextMenuTypes
    proposed: true
  - from: kShadcnSelectionHandleSize
    to: kSelectionHandleSize
    proposed: true
  - from: _shadcnBoxSizes
    to: _boxSizes
    proposed: true
    note: Test helper in test/registry/layout_audit/spatial_scan_rules.dart.
  - from: ShadcnThemeDataView
    to: ThemeDataView
    proposed: true
    note: Test-only helper class in test/registry/themes/generated_theme.dart.
  - from: showShadcnPicker
    to: showPicker
    proposed: true
    note: Docs-only helper in docs/lib/widgets/rail_pickers.dart.
  - from: shadcnTheme
    to: themeData
    proposed: true
    note: Local variable (~100 sites in kit_lib + docs mirror). The codemod
      renames per-declaration via the analyzer; if `themeData` is already
      bound in the same scope it must report instead of shadowing.
  - from: shadcn
    to: themeData
    proposed: true
    note: Bare local variable in chat.dart, history.dart, timeline.dart (same
      conflict rule as shadcnTheme). Named-argument labels and fields are
      renamed too; only locals/params block on a `themeData` collision.
  - from: shadcn_dialog
    to: dashcn_dialog
    proposed: true
    note: Import prefix in flutter_cli_verification_example (code) and skills
      samples (text, via the strings rule below).
  # Removals (no `to:`).
  - from: ShadcnUI
    action: remove
    proposed: true
    note: §2 says "remove (barrel replaces it)". Class in
      lib/src/components/app/app.dart, used once internally by ShadcnApp
      (`_buildApp`) and twice in app_test.dart. The proposal is to inline the
      DefaultTextStyle/IconTheme scope into `_buildApp`, delete the class,
      rewrite the two tests against DashcnApp. Needs explicit approval
      (behaviour-adjacent, not a pure rename).

# Prefix families (applied after exact renames; leading `_` is preserved).
prefixes:
  - { prefix: ShadcnTable, replacement: TableView }
  - { prefix: ShadcnRadioGroup, replacement: RadioSet }
  - { prefix: ShadcnPage, replacement: AppPage }
  - { prefix: ShadcnLocalizations, replacement: ComponentLocalizations }
  - { prefix: showShadcn, replacement: show }

# Ordered string rules for the explicit string/markdown/JSON pass
# (longest `from` first; identifiers above are NOT re-applied as strings).
strings:
  - { from: flutter_shadcn_kit, to: dashcn }
  - { from: flutter_shadcn_cli, to: dashcn_cli }
  - { from: flutter_shadcn, to: dashcn }
  - { from: flutter-shadcn-kit, to: dashcn-kit, proposed: true }
  - { from: flutter-shadcn-ui, to: dashcn-ui, proposed: true }
  - { from: flutterShadcnKit, to: dashcnExample, proposed: true,
      note: 'Bundle ids com.example.flutterShadcnKit (example/ios, macos).
        Brief says `dashcn_example`; camelCase keeps reverse-DNS style.' }
  - { from: ShadCN, to: DashCN, proposed: true,
      note: 'Brand-case prose in skills (no code identifier uses it).' }
  - { from: ui/shadcn, to: ui/dashcn }
  - { from: shadcn_flutter_theme_changed, to: dashcn_theme_changed }
  - { from: shadcn_flutter_app_ready, to: dashcn_app_ready, proposed: true,
      note: Same JS bridge as the theme event (web_bridge_web.dart). }
  - { from: shadcn_flutter_sheet_overlay, to: dashcn_sheet_overlay,
      proposed: true, note: 'Data-widget Model key in sheet_overlay.dart.' }
  - { from: shadcn_dialog, to: dashcn_dialog, proposed: true,
      note: Import prefix in flutter_cli_verification_example + skills. }
  - { from: shadcn_fixed, to: theme_fixed, proposed: true,
      note: spatial_scan category tag + description prose. }
  - { from: SHADCN_SHOW_TECHNICAL_ERRORS, to: DASHCN_SHOW_TECHNICAL_ERRORS,
      proposed: true, note: '--dart-define key in error_models.dart.' }
  - { from: shadcn_flutter, to: dashcn, proposed: true,
      note: 'registry.name in lib/src/manifests/registry.json (CLI contract;
        P8-3 consumes this map).' }
  # Manifest CLI contract fields (P8-3 consumes; string pass rewrites them).
  - { from: 'flutter_shadcn add ', to: 'dashcn add ', proposed: true,
      note: 'manifest `install:` fields (×134).' }
  - { from: package:<your_app>/ui/shadcn/, to: package:<your_app>/ui/dashcn/,
      proposed: true, note: 'manifest `import:` fields.' }

# Rule 1(c): Dart comments. Applied per comment span AFTER the identifier
# renames (rule a) and the `strings` rules (rule b), longest `from` first,
# whole-word matches only. Identifiers (ShadcnX) are already gone via rule
# (a), so what remains is prose citing the upstream web design as the spec.
comment_rules:
  - { from: 'the shadcn/ui', to: 'the upstream web kit' }
  - { from: 'the Shadcn/ui', to: 'the upstream web kit' }
  - { from: 'shadcn/ui', to: 'the upstream web kit' }
  - { from: 'Shadcn/ui', to: 'the upstream web kit' }
  - { from: "shadcn's", to: "upstream's" }
  - { from: "Shadcn's", to: "Upstream's" }
  - { from: 'Shadcn', to: 'Upstream' }
  - { from: 'shadcn', to: 'upstream' }

# Rule 1(d): Markdown (*.md, skills, READMEs): `shadcn/ui` first, everything
# else falls back to `dashcn`. The credits sentence
# "Design inspired by shadcn/ui." is exempt (allow-list) and must be added
# where missing, never rewritten.
markdown_rules:
  - { from: 'the shadcn/ui', to: 'the upstream web kit' }
  - { from: 'the Shadcn/ui', to: 'the upstream web kit' }
  - { from: 'shadcn/ui', to: 'the upstream web kit' }
  - { from: 'Shadcn/ui', to: 'the upstream web kit' }
  - { from: 'Shadcn', to: 'Dashcn' }
  - { from: 'SHADCN', to: 'DASHCN' }
  - { from: 'shadcn', to: 'dashcn' }

# Rule 1(e): every other remaining text.
fallback:
  rules:
    - { from: Shadcn, to: Dashcn }
    - { from: SHADCN, to: DASHCN }
    - { from: shadcn, to: dashcn }

# Generated outputs the codemod skips (regenerated in step 6 from the renamed
# sources, so codemod output can never skew them). Each entry names the file
# or directory (kit-relative) plus the owning generator.
generated:
  - { path: dashcn/lib/dashcn.dart, by: tool/gen_exports.dart }
  - { path: dashcn/lib/foundation.dart, by: tool/gen_exports.dart }
  - { path: dashcn/lib/theme.dart, by: tool/gen_exports.dart }
  - { path: dashcn/lib/primitives.dart, by: tool/gen_exports.dart }
  - { path: dashcn/lib/components/, by: tool/gen_exports.dart }
  - { path: dashcn/lib/blocks/, by: tool/gen_exports.dart }
  - { path: dashcn/lib/src/manifests/registry.json, by: tool/registry/gen_registry_manifest.dart }
  - { path: dashcn/test/registry/previews_test.dart, by: tool/registry/gen_previews_test.dart }
  - { path: dashcn/test/registry/blocks/blocks_render_test.dart, by: tool/registry/gen_blocks_test.dart }
  - { path: dashcn/test/registry/blocks/blocks_meta_test.dart, by: tool/registry/gen_blocks_test.dart }
  - { path: dashcn/gen/llms-full.txt, by: gen/bin/llms_gen.dart }
  - { path: dashcn/.guides/, by: gen/bin/dotguides_gen.dart }
  - { path: docs/lib/generated/, by: docs/tool/gen_docs_data.dart }

# File / directory renames (git mv; content pass runs first).
paths:
  - { from: docs/lib/ui/shadcn/, to: docs/lib/ui/dashcn/, note: Mirror of
      dashcn/lib/src; sync_registry.sh DEST changes, then resync. }
  - { from: dashcn/flutter_cli_verification_example/lib/ui/shadcn/,
      to: dashcn/flutter_cli_verification_example/lib/ui/dashcn/ }
  - { from: dashcn/test/shadcn_app_localizations_test.dart,
      to: dashcn/test/dashcn_app_localizations_test.dart, proposed: true }
  - { from: dashcn/test/registry/layout_audit/layout_audit_shadcn_values_test.dart,
      to: dashcn/test/registry/layout_audit/layout_audit_dashcn_values_test.dart,
      proposed: true,
      note: Pins shadcn values; `shadcn/ui` prose inside stays (attribution). }
  - { from: dashcn/skills/flutter-shadcn-kit/, to: dashcn/skills/dashcn-kit/,
      proposed: true }
  - { from: dashcn/skills/flutter-shadcn-ui/, to: dashcn/skills/dashcn-ui/,
      proposed: true }

# Proposed check_names allow-list (tool/check_names_allow.txt): substring
# entries, each with a justification. Everything else must be clean.
allow_list:
  - entry: 'Design inspired by shadcn/ui.'
    why: Credits sentence only (dashcn/README.md Credits section + docs
      introduction page). Added where missing, never rewritten.
  - entry: github.com/mibrar-dev/shadcn_flutter_kit
    why: 'pubspec homepage/repository/issue_tracker + docs footer URL.
      Repo rename needs Ibrar approval (PACKAGE §3); rewriting the URL before
      the repo exists breaks the link.'
  - entry: flutter-shadcn.github.io
    why: 'themes.schema.json $id (old GitHub Pages site; same pending rename).'
  - entry: shadcn_flutter_kit
    why: 'The real GitHub repo name (URLs, the GitHub Pages base path in
      docs-deploy.yml baseHref + docs_router kDocsBasePath and its tests). Added
      by the orchestrator at P8-2 QA; REMOVE when the repo is renamed.'

# Out of scope for P8-2 (owns/guardrail), listed so nothing is silently missed.
out_of_scope:
  - docs/superpowers/** (~300 historical checkpoint/plan mentions; guardrail
    does not scan docs/ outside lib+test+tool+web)
  - docs/README.md, docs/pubspec.yaml, docs/public/llms-full.txt (P8-4)
  - docs/flutter_shadcn_complete_user_guide.pdf,
    docs/web/flutter_shadcn_complete_user_guide.pdf (binary; propose rename to
    dashcn_complete_user_guide.pdf — needs orchestrator, outside owns)
  - dashcn/dart_analyze_flutter_shadcn_kit.txt + the .pubignore line naming it
    (P8-1 recommended deletion; propose `git rm` + drop the ignore line)
  - rearch/** historical reports/briefs (never renamed; guardrail excludes)
