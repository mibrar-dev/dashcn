name: dashcn_example
description: Example app for the dashcn package.
publish_to: none
version: 1.0.0

environment:
  # Same SDK floor as the parent `dashcn` package.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dashcn:
    path: ../
  # The example renders dashcn localizations alongside the global widgets
  # localizations, like any consumer app.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
