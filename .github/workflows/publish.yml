name: Publish to pub.dev

on:
  push:
    tags:
      # Must stay in sync with the tag pattern configured for `dashcn` on
      # pub.dev automated publishing: `v{{version}}`.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  check-tag:
    name: Tag matches pubspec version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail when the tag is not v<dashcn version>
        run: |
          version="$(sed -n 's/^version: *//p' dashcn/pubspec.yaml | tr -d '[:space:]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match dashcn/pubspec.yaml version $version (expected v$version)" >&2
            exit 1
          fi

  publish:
    # dashcn is a Flutter package: the reusable dart-lang publish workflow only
    # installs the Dart SDK and cannot resolve `sdk: flutter`. This follows the
    # dart.dev pattern for Flutter packages: setup-dart provides the pub.dev
    # OIDC credentials, flutter-action provides the SDK, `flutter pub publish`.
    needs: check-tag
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # Required for pub.dev OIDC automated publishing.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart (pub.dev OIDC token)
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Install dependencies
        working-directory: dashcn
        run: flutter pub get

      - name: Publish
        working-directory: dashcn
        run: flutter pub publish --force
