name: CI

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

jobs:
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashcn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test test/registry test/rearch test/tool test/scorecards

      - name: Trust scorecards up to date
        run: dart run tool/gen_scorecards.dart --check

      - name: Generated exports up to date
        run: dart run tool/gen_exports.dart --check

      - name: Plain-names guardrail
        run: dart run tool/check_names.dart

      - name: Generated manifest and tests up to date
        run: |
          dart run tool/registry/gen_registry_manifest.dart --check
          dart run tool/registry/gen_previews_test.dart --check
          dart run tool/registry/gen_blocks_test.dart --check

      - name: Layer and theme guardrails
        run: |
          dart run tool/rearch/check_layers.dart --root lib/src --strict
          dart run tool/rearch/check_single_owner.dart --root lib/src
          dart run tool/rearch/check_user_theme.dart --root lib/src --strict

      - name: Publish dry-run
        run: dart pub publish --dry-run

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Install rsync (registry mirror check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Generated data and registry mirror up to date
        run: |
          dart run tool/gen_docs_data.dart --check
          bash tool/sync_registry.sh --check

      - name: Tests
        run: flutter test test tool  # tool/ holds the generator tests (goldens)

      - name: Build web
        run: flutter build web --release
