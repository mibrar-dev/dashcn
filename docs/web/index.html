  <!--
    First-paint placeholder. The primary boot animation is the Rive file
    boot.riv (built offline from docs/rive/boot, no account needed), drawn
    on the canvas below with the @rive-app/canvas runtime pinned to an
    exact version on jsDelivr. It plays one state machine named `boot`
    with a number input `progress` (JS advances it, capped at 90) and a
    boolean input `ready` (set on `flutter-first-frame`, when the bird
    swoops to the page edge, grips it, and carries it up and away
    like lifting a sheet of paper; smooth lift-away, then this node
    is removed).

    The old CSS animation markup is kept as a .boot-fallback: it shows
    immediately, stays if the .riv fails to load or WebAssembly/canvas is
    unavailable within 3 s, and is the static finished frame under
    prefers-reduced-motion (Rive is not started there at all). Removed on
    `flutter-first-frame`.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171717;
      color: #e5e5e5;
      font-family: "Geist Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    /* First paint before the app reports its theme: follow the system mode so
       a light-mode visitor never sees a dark flash. The app then sets the
       exact preset colours through `dashcn_theme_changed`. */
    @media (prefers-color-scheme: light) {
      html, body {
        background: #ffffff;
        color: #000000;
      }
      #docs-first-paint .boot-status {
        color: #737373;
      }
    }
    /* An explicit data-theme on <html> wins over the media query when set. */
    html[data-theme="light"], html[data-theme="light"] body {
      background: #ffffff;
      color: #000000;
    }
    html[data-theme="light"] #docs-first-paint .boot-status {
      color: #737373;
    }
    html[data-theme="dark"], html[data-theme="dark"] body {
      background: #171717;
      color: #e5e5e5;
    }
    html[data-theme="dark"] #docs-first-paint .boot-status {
      color: #a3a3a3;
    }
    #docs-first-paint {
      position: fixed;
      inset: 0;
      z-index: 10;
      box-sizing: border-box;
      overflow: clip;
      text-align: center;
    }
    #docs-first-paint.fade-out {
      opacity: 0;
      transition: opacity 300ms ease;
    }
    #docs-first-paint .boot-mark {
      width: 72px;
      height: 72px;
      /* Soft loop after the intro: gentle breathe until Flutter takes over. */
      animation: boot-breathe 2400ms ease-in-out 1600ms infinite;
    }
    /* Rive canvas: fullscreen, hidden until the first frame is drawn; the
       CSS fallback stays centred until then (and forever if loading
       fails, WebAssembly/canvas is missing, or reduced motion is on). */
    #boot-rive {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #docs-first-paint.rive-on #boot-rive {
      display: block;
    }
    #docs-first-paint.rive-on .boot-fallback {
      display: none;
    }
    #docs-first-paint .boot-fallback {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 0 24px;
    }
    #docs-first-paint .boot-mark svg {
      display: block;
      width: 72px;
      height: 72px;
    }
    /* Full-colour bird fills: fade in once the strokes have drawn. */
    #docs-first-paint .boot-fill {
      opacity: 1;
      animation: boot-fill 500ms ease-out 300ms both;
    }
    /* Stroke outlines: draw on, then the wrapper fades them away. */
    #docs-first-paint .boot-lines {
      opacity: 0;
      animation: boot-lines 900ms ease-out 0ms both;
    }
    #docs-first-paint .boot-line {
      fill: none;
      stroke: currentColor;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: boot-draw 700ms ease-out 0ms forwards;
    }
    #docs-first-paint .boot-line.body { animation-delay: 90ms; }
    #docs-first-paint .boot-line.wing { animation-delay: 180ms; }
    /* Sheen sweep, clipped to the body: a single pass, then gone. */
    #docs-first-paint .boot-sheen {
      opacity: 0;
      animation: boot-sweep 450ms ease-in-out 800ms both;
    }
    #docs-first-paint .boot-word {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
      animation: boot-rise 400ms ease-out 900ms both;
    }
    #docs-first-paint .boot-status {
      font-size: 14px;
      color: #a3a3a3;
      animation: boot-status-in 400ms ease-out 1200ms both;
    }
    #docs-first-paint .boot-dots i {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      margin-left: 3px;
      vertical-align: baseline;
      animation: boot-dot 1200ms ease-in-out infinite;
    }
    #docs-first-paint .boot-dots i:nth-child(2) { animation-delay: 200ms; }
    #docs-first-paint .boot-dots i:nth-child(3) { animation-delay: 400ms; }
    @keyframes boot-draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes boot-lines {
      0% { opacity: 0; }
      12% { opacity: 1; }
      72% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes boot-fill {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes boot-sweep {
      0% { opacity: 0; transform: translateX(-120px); }
      18% { opacity: 0.85; }
      82% { opacity: 0.85; }
      100% { opacity: 0; transform: translateX(120px); }
    }
    @keyframes boot-rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes boot-status-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes boot-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes boot-dot {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #docs-first-paint .boot-mark,
      #docs-first-paint .boot-fill,
      #docs-first-paint .boot-lines,
      #docs-first-paint .boot-line,
      #docs-first-paint .boot-sheen,
      #docs-first-paint .boot-word,
      #docs-first-paint .boot-status,
      #docs-first-paint .boot-dots i {
        animation: none;
      }
      /* Finished state, instantly: full-colour mark, text, solid dots. */
      #docs-first-paint .boot-fill { opacity: 1; }
      #docs-first-paint .boot-lines,
      #docs-first-paint .boot-sheen { opacity: 0; }
      #docs-first-paint .boot-word,
      #docs-first-paint .boot-status { opacity: 1; transform: none; }
      #docs-first-paint .boot-dots i { opacity: 1; }
    }
  </style>
  <script>
    // Fall back to en-US when the browser reports no usable locale (P9-Z).
    //
    // Headless Chromium without LANG reports `navigator.language === 'C'`
    // (or an empty/odd tag); the Flutter engine feeds that string straight
    // into a Locale constructor, which throws `RangeError: Incorrect locale
    // information provided` and kills boot before the first frame. The
    // kit's own locale resolution already falls back to English for every
    // Locale object — this shim only repairs the browser string the engine
    // parses, before `flutter_bootstrap.js` loads.
    (function () {
      function usable(value) {
        if (typeof value !== 'string' || value.length < 2) {
          return false;
        }
        try {
          if (typeof Intl !== 'undefined' && Intl.Locale) {
            new Intl.Locale(value);
            return true;
          }
        } catch (_) {
          return false;
        }
        return /^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})*$/.test(value);
      }
      try {
        var nav = window.navigator;
        if (!nav) {
          return;
        }
        var ok =
          usable(nav.language) &&
          Array.isArray(nav.languages) &&
          nav.languages.length > 0 &&
          usable(nav.languages[0]);
        if (!ok) {
          Object.defineProperty(nav, 'language', {
            configurable: true,
            get: function () {
              return 'en-US';
            },
          });
          Object.defineProperty(nav, 'languages', {
            configurable: true,
            get: function () {
              return ['en-US'];
            },
          });
        }
      } catch (_) {
        // A sealed navigator keeps the old values; boot then fails exactly
        // as before (no new failure mode introduced).
      }
    })();
  </script>
  <script>
    // Drop the placeholder as soon as Flutter paints its first frame.
    // When the Rive loader is active, first play the lift-off (ready = true:
    // the flock grips the sheet's top edge and lifts it up and off in
    // ~950 ms: 150 ms blend + 800 ms lift) and remove the node after.
    // Under prefers-reduced-motion (Rive never started) fade out in 300 ms.
    // Otherwise remove immediately, exactly as before.
    (function () {
      var OUTRO_MS = 950;
      function removePlaceholder() {
        var placeholder = document.getElementById('docs-first-paint');
        if (placeholder) {
          placeholder.remove();
        }
      }
      window.addEventListener('flutter-first-frame', function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            var ph = document.getElementById('docs-first-paint');
            if (ph) {
              ph.classList.add('fade-out');
              window.setTimeout(removePlaceholder, 320);
              return;
            }
          }
        } catch (_) {
          // Fall through.
        }
        try {
          if (window.__bootRiveDone && window.__bootRiveDone()) {
            window.setTimeout(removePlaceholder, OUTRO_MS);
            return;
          }
        } catch (_) {
          // Fall through to immediate removal.
        }
        removePlaceholder();
      });
    })();
    // Keep the page background in sync with the active preset/mode so any
    // area Flutter does not paint (overscroll, resize gaps) matches the app.
    window.addEventListener('dashcn_theme_changed', function (event) {
      var detail = event.detail || {};
      if (detail.background) {
        document.documentElement.style.background = detail.background;
        document.body.style.background = detail.background;
      }
      if (detail.foreground) {
        document.body.style.color = detail.foreground;
      }
    });
  </script>
</head>
<body>

  <script>
    // Rive boot loader. Starts immediately on page load (never waits for
    // flutter-first-frame). Hides the CSS fallback only after the Rive
    // canvas has drawn its first frame (onPlay + double rAF); the fallback
    // stays for failure cases only (runtime/.riv fail, no WebAssembly,
    // or prefers-reduced-motion, where Rive is never started).
    //
    // - Artboard BootDark/BootLight follows html[data-theme], else the
    //   prefers-color-scheme media query (same rule as the page CSS).
    // - prefers-reduced-motion: Rive is never started; the CSS fallback
    //   already renders its finished state with no animation.
    // - If the runtime or the .riv fails (or takes longer than 3 s), the
    //   CSS fallback simply stays.
    // - progress drives only the thin loading bar (capped at 90, 100 on ready).
    (function () {
      var RIVE_VERSION = '2.44.0';
      var RIVE_CDN = 'https://cdn.jsdelivr.net/npm/@rive-app/canvas@' + RIVE_VERSION + '/rive.min.js';
      var TIMEOUT_MS = 3000;
      var TICK_MS = 140;
      var PROGRESS_CAP = 90;

      var placeholder = document.getElementById('docs-first-paint');
      var canvas = document.getElementById('boot-rive');
      if (!placeholder || !canvas) {
        return;
      }
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }
        if (!window.WebAssembly || !canvas.getContext) {
          return;
        }
      } catch (_) {
        return;
      }

      var settled = false;
      var shown = false;
      var instance = null;
      var progressInput = null;
      var readyInput = null;
      var ticker = 0;
      var progress = 0;

      function artboard() {
        try {
          var t = document.documentElement.getAttribute('data-theme');
          if (t === 'light') {
            return 'BootLight';
          }
          if (t === 'dark') {
            return 'BootDark';
          }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            return 'BootLight';
          }
        } catch (_) {
          // Fall through to dark.
        }
        return 'BootDark';
      }

      function stopTicker() {
        if (ticker) {
          window.clearInterval(ticker);
          ticker = 0;
        }
      }

      function fail() {
        if (settled) {
          return;
        }
        settled = true;
        stopTicker();
        instance = null;
        progressInput = null;
        readyInput = null;
        // The CSS fallback stays visible; nothing else to do.
      }

      function startTicker() {
        stopTicker();
        ticker = window.setInterval(function () {
          if (!progressInput) {
            return;
          }
          progress = Math.min(PROGRESS_CAP, progress + 1 + Math.random() * 2.5);
          try {
            progressInput.value = progress;
          } catch (_) {
            stopTicker();
          }
        }, TICK_MS);
      }

      function showRive() {
        if (shown || settled) {
          return;
        }
        shown = true;
        settled = true;
        try {
          if (instance && instance.resizeDrawingSurfaceToCanvas) {
            instance.resizeDrawingSurfaceToCanvas();
          }
        } catch (_) {
          // Ignore; canvas still draws at its attribute size.
        }
        placeholder.classList.add('rive-on');
        startTicker();
      }

      // Called by the flutter-first-frame listener: when Rive is up, fire
      // the lift-away (ready = true: birds grip the sheet top edge and lift
      // it up and off in ~950 ms) and report back so removal waits.
      window.__bootRiveDone = function () {
        if (!instance || !readyInput || !shown) {
          return false;
        }
        try {
          if (progressInput) {
            progressInput.value = 100;
          }
          readyInput.value = true;
        } catch (_) {
          return false;
        }
        stopTicker();
        return true;
      };

      function resize() {
        try {
          if (instance && instance.resizeDrawingSurfaceToCanvas) {
            instance.resizeDrawingSurfaceToCanvas();
          }
        } catch (_) {
          // Ignore.
        }
      }

      function init() {
        if (settled) {
          return;
        }
        var runtime = window.rive;
        if (!runtime || !runtime.Rive) {
          fail();
          return;
        }
        try {
          instance = new runtime.Rive({
            src: 'boot.riv',
            artboard: artboard(),
            stateMachine: 'boot',
            canvas: canvas,
            autoplay: true,
            layout: new runtime.Layout({ fit: 'cover', alignment: 'center' }),
            onLoad: function () {
              if (shown) {
                return;
              }
              try {
                var inputs = instance.stateMachineInputs('boot') || [];
                for (var i = 0; i < inputs.length; i++) {
                  if (inputs[i].name === 'progress') {
                    progressInput = inputs[i];
                  } else if (inputs[i].name === 'ready') {
                    readyInput = inputs[i];
                  }
                }
              } catch (_) {
                progressInput = null;
                readyInput = null;
              }
              try {
                if (instance.resizeDrawingSurfaceToCanvas) {
                  instance.resizeDrawingSurfaceToCanvas();
                }
              } catch (_) {
                // Ignore.
              }
              // Hide the fallback only after the first frame is drawn:
              // onPlay fires when playback starts, double rAF lands after
              // the first present. Either path shows once.
              try {
                window.requestAnimationFrame(function () {
                  window.requestAnimationFrame(showRive);
                });
              } catch (_) {
                showRive();
              }
            },
            onPlay: function () {
              showRive();
            },
            onLoadError: function () {
              fail();
            },
          });
          try {
            window.addEventListener('resize', resize);
          } catch (_) {
            // Ignore.
          }
        } catch (_) {
          fail();
        }
      }

      window.setTimeout(function () {
        if (!settled || !instance) {
          // If the runtime script itself never arrived, give up; if the
          // instance exists but hasn't loaded, keep waiting for it only
          // when the fallback is already acceptable either way. Either
          // path leaves the CSS fallback in place.
          if (!instance) {
            fail();
          }
        }
      }, TIMEOUT_MS);

      var script = document.createElement('script');
      script.src = RIVE_CDN;
      script.async = true;
      script.onload = init;
      script.onerror = fail;
      document.head.appendChild(script);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
