  <!--
    First-paint placeholder. The primary boot animation is the Rive file
    boot.riv (built offline from docs/rive/boot, no account needed), drawn
    on the canvas below with the vendored @rive-app/canvas runtime
    (docs/web/rive.min.js, same-origin, preloaded, synchronous) so the
    flock renders on the very first paint. It plays one state machine
    named `boot` with a number input `progress` (JS advances it, capped
    at 90) and a boolean input `ready` (set on `flutter-first-frame`,
    when the birds gather under the sheet and carry it up and off
    over ~950 ms: 150 ms blend + 800 ms lift; only then is this node
    removed).

    The old CSS animation markup is kept as a .boot-fallback but hidden
    by default: it shows only if the runtime or .riv fails, WebAssembly
    or canvas is unavailable, or prefers-reduced-motion is on (Rive is
    not started there at all; the fallback shows its static finished
    frame and fades out in 300 ms on `flutter-first-frame`).
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171717;
      color: #e5e5e5;
      font-family: "Geist Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    /* First paint before the app reports its theme: follow the system mode so
       a light-mode visitor never sees a dark flash. The app then sets the
       exact preset colours through `dashcn_theme_changed`. */
    @media (prefers-color-scheme: light) {
      html, body {
        background: #ffffff;
        color: #000000;
      }
      #docs-first-paint .boot-status {
        color: #737373;
      }
    }
    /* An explicit data-theme on <html> wins over the media query when set. */
    html[data-theme="light"], html[data-theme="light"] body {
      background: #ffffff;
      color: #000000;
    }
    html[data-theme="light"] #docs-first-paint .boot-status {
      color: #737373;
    }
    html[data-theme="dark"], html[data-theme="dark"] body {
      background: #171717;
      color: #e5e5e5;
    }
    html[data-theme="dark"] #docs-first-paint .boot-status {
      color: #a3a3a3;
    }
    #docs-first-paint {
      position: fixed;
      inset: 0;
      z-index: 10;
      box-sizing: border-box;
      overflow: clip;
      text-align: center;
    }
    #docs-first-paint.fade-out {
      opacity: 0;
      transition: opacity 300ms ease;
    }
    #docs-first-paint .boot-mark {
      width: 72px;
      height: 72px;
      /* Soft loop after the intro: gentle breathe until Flutter takes over. */
      animation: boot-breathe 2400ms ease-in-out 1600ms infinite;
    }
    /* Rive canvas: fullscreen and visible from first paint. The CSS
       fallback is hidden unless Rive fails (runtime/.riv error, no
       WebAssembly/canvas) or prefers-reduced-motion is on (Rive never
       starts; the fallback shows its static finished frame). */
    #boot-rive {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #docs-first-paint.show-fallback #boot-rive {
      display: none;
    }
    #docs-first-paint .boot-fallback {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 0 24px;
    }
    #docs-first-paint.show-fallback .boot-fallback {
      display: flex;
    }
    #docs-first-paint .boot-mark svg {
      display: block;
      width: 72px;
      height: 72px;
    }
    /* Full-colour bird fills: fade in once the strokes have drawn. */
    #docs-first-paint .boot-fill {
      opacity: 1;
      animation: boot-fill 500ms ease-out 300ms both;
    }
    /* Stroke outlines: draw on, then the wrapper fades them away. */
    #docs-first-paint .boot-lines {
      opacity: 0;
      animation: boot-lines 900ms ease-out 0ms both;
    }
    #docs-first-paint .boot-line {
      fill: none;
      stroke: currentColor;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: boot-draw 700ms ease-out 0ms forwards;
    }
    #docs-first-paint .boot-line.body { animation-delay: 90ms; }
    #docs-first-paint .boot-line.wing { animation-delay: 180ms; }
    /* Sheen sweep, clipped to the body: a single pass, then gone. */
    #docs-first-paint .boot-sheen {
      opacity: 0;
      animation: boot-sweep 450ms ease-in-out 800ms both;
    }
    #docs-first-paint .boot-word {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
      animation: boot-rise 400ms ease-out 900ms both;
    }
    #docs-first-paint .boot-status {
      font-size: 14px;
      color: #a3a3a3;
      animation: boot-status-in 400ms ease-out 1200ms both;
    }
    #docs-first-paint .boot-dots i {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      margin-left: 3px;
      vertical-align: baseline;
      animation: boot-dot 1200ms ease-in-out infinite;
    }
    #docs-first-paint .boot-dots i:nth-child(2) { animation-delay: 200ms; }
    #docs-first-paint .boot-dots i:nth-child(3) { animation-delay: 400ms; }
    @keyframes boot-draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes boot-lines {
      0% { opacity: 0; }
      12% { opacity: 1; }
      72% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes boot-fill {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes boot-sweep {
      0% { opacity: 0; transform: translateX(-120px); }
      18% { opacity: 0.85; }
      82% { opacity: 0.85; }
      100% { opacity: 0; transform: translateX(120px); }
    }
    @keyframes boot-rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes boot-status-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes boot-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes boot-dot {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #docs-first-paint .boot-mark,
      #docs-first-paint .boot-fill,
      #docs-first-paint .boot-lines,
      #docs-first-paint .boot-line,
      #docs-first-paint .boot-sheen,
      #docs-first-paint .boot-word,
      #docs-first-paint .boot-status,
      #docs-first-paint .boot-dots i {
        animation: none;
      }
      /* Finished state, instantly: full-colour mark, text, solid dots. */
      #docs-first-paint .boot-fill { opacity: 1; }
      #docs-first-paint .boot-lines,
      #docs-first-paint .boot-sheen { opacity: 0; }
      #docs-first-paint .boot-word,
      #docs-first-paint .boot-status { opacity: 1; transform: none; }
      #docs-first-paint .boot-dots i { opacity: 1; }
    }
  </style>
  <script>
    // Fall back to en-US when the browser reports no usable locale (P9-Z).
    //
    // Headless Chromium without LANG reports `navigator.language === 'C'`
    // (or an empty/odd tag); the Flutter engine feeds that string straight
    // into a Locale constructor, which throws `RangeError: Incorrect locale
    // information provided` and kills boot before the first frame. The
    // kit's own locale resolution already falls back to English for every
    // Locale object — this shim only repairs the browser string the engine
    // parses, before `flutter_bootstrap.js` loads.
    (function () {
      function usable(value) {
        if (typeof value !== 'string' || value.length < 2) {
          return false;
        }
        try {
          if (typeof Intl !== 'undefined' && Intl.Locale) {
            new Intl.Locale(value);
            return true;
          }
        } catch (_) {
          return false;
        }
        return /^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})*$/.test(value);
      }
      try {
        var nav = window.navigator;
        if (!nav) {
          return;
        }
        var ok =
          usable(nav.language) &&
          Array.isArray(nav.languages) &&
          nav.languages.length > 0 &&
          usable(nav.languages[0]);
        if (!ok) {
          Object.defineProperty(nav, 'language', {
            configurable: true,
            get: function () {
              return 'en-US';
            },
          });
          Object.defineProperty(nav, 'languages', {
            configurable: true,
            get: function () {
              return ['en-US'];
            },
          });
        }
      } catch (_) {
        // A sealed navigator keeps the old values; boot then fails exactly
        // as before (no new failure mode introduced).
      }
    })();
  </script>
  <script>
    // Drop the placeholder after Flutter paints its first frame.
    // When the Rive loader is active, first play the lift-off (ready = true:
    // the birds gather under the sheet and carry it up and off over
    // ~950 ms: 150 ms blend + 800 ms lift with ease-in-out) and remove the
    // node only after the lift completes. Never cut: if Rive is still
    // loading when Flutter fires, __bootRiveDone records the request and
    // the lift + delayed removal happen on load. If Rive failed, remove
    // immediately. Under prefers-reduced-motion (Rive never started, the
    // static CSS fallback is showing) fade out in 300 ms.
    (function () {
      var OUTRO_MS = 1000;
      function removePlaceholder() {
        var placeholder = document.getElementById('docs-first-paint');
        if (placeholder) {
          placeholder.remove();
        }
      }
      window.addEventListener('flutter-first-frame', function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            var ph = document.getElementById('docs-first-paint');
            if (ph) {
              ph.classList.add('fade-out');
              window.setTimeout(removePlaceholder, 320);
              return;
            }
          }
        } catch (_) {
          // Fall through.
        }
        try {
          if (window.__bootRiveDone && window.__bootRiveDone()) {
            // Rive owns removal now (lift plays, then the node goes away).
            // The timeout is a backstop; the Rive script schedules the real
            // removal after OUTRO_MS.
            window.setTimeout(function () {
              var still = document.getElementById('docs-first-paint');
              if (still && !window.__bootRiveRemoved) {
                removePlaceholder();
              }
            }, OUTRO_MS + 400);
            return;
          }
        } catch (_) {
          // Fall through to immediate removal.
        }
        removePlaceholder();
      });
    })();
    // Keep the page background in sync with the active preset/mode so any
    // area Flutter does not paint (overscroll, resize gaps) matches the app.
    window.addEventListener('dashcn_theme_changed', function (event) {
      var detail = event.detail || {};
      if (detail.background) {
        document.documentElement.style.background = detail.background;
        document.body.style.background = detail.background;
      }
      if (detail.foreground) {
        document.body.style.color = detail.foreground;
      }
    });
  </script>

  <script>
    // Rive boot loader. The runtime (rive.min.js) is vendored same-origin
    // and loaded synchronously in <head>, so this starts immediately during
    // page load and the flock paints on the very first frame — the CSS
    // fallback is hidden by default and only shown on failure.
    //
    // - Artboard BootDark/BootLight follows html[data-theme], else the
    //   prefers-color-scheme media query (same rule as the page CSS).
    // - prefers-reduced-motion: Rive is never started; the CSS fallback is
    //   shown immediately and already renders its finished state.
    // - Runtime/.riv failure (or >3 s without load): the CSS fallback is
    //   shown and stays.
    // - progress drives only the thin loading bar (capped at 90, 100 on ready).
    // - On flutter-first-frame, ready=true plays the lift (birds grip the
    //   gather under the sheet and carry it up and off over ~950 ms with
    //   ease-in-out); the placeholder node is removed only after the lift
    //   completes. If Flutter fires before Rive loads, the request is
    //   recorded and the lift + removal happen on load — never a cut.
    (function () {
      var TIMEOUT_MS = 3000;
      var TICK_MS = 140;
      var PROGRESS_CAP = 90;
      var OUTRO_MS = 1000;

      var placeholder = document.getElementById('docs-first-paint');
      var canvas = document.getElementById('boot-rive');
      if (!placeholder || !canvas) {
        return;
      }
      try {
        window.__bootTimes.initStart = performance.now();
      } catch (_) {
        // Ignore.
      }

      var loaded = false;
      var failed = false;
      var flutterFired = false;
      var removalScheduled = false;
      var instance = null;
      var progressInput = null;
      var readyInput = null;
      var ticker = 0;
      var progress = 0;

      function artboard() {
        try {
          var t = document.documentElement.getAttribute('data-theme');
          if (t === 'light') {
            return 'BootLight';
          }
          if (t === 'dark') {
            return 'BootDark';
          }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            return 'BootLight';
          }
        } catch (_) {
          // Fall through to dark.
        }
        return 'BootDark';
      }

      function stopTicker() {
        if (ticker) {
          window.clearInterval(ticker);
          ticker = 0;
        }
      }

      function showFallback() {
        try {
          placeholder.classList.add('show-fallback');
        } catch (_) {
          // Ignore.
        }
      }

      function fail() {
        if (loaded || failed) {
          return;
        }
        failed = true;
        stopTicker();
        instance = null;
        progressInput = null;
        readyInput = null;
        showFallback();
      }

      function startTicker() {
        stopTicker();
        ticker = window.setInterval(function () {
          if (!progressInput) {
            return;
          }
          progress = Math.min(PROGRESS_CAP, progress + 1 + Math.random() * 2.5);
          try {
            progressInput.value = progress;
          } catch (_) {
            stopTicker();
          }
        }, TICK_MS);
      }

      function scheduleRemoval() {
        if (removalScheduled) {
          return;
        }
        removalScheduled = true;
        window.setTimeout(function () {
          var ph = document.getElementById('docs-first-paint');
          if (ph) {
            ph.remove();
          }
          window.__bootRiveRemoved = true;
          try {
            window.__bootTimes.removed = performance.now();
          } catch (_) {
            // Ignore.
          }
        }, OUTRO_MS);
      }

      function fireLift() {
        if (!instance || !readyInput) {
          return false;
        }
        try {
          if (progressInput) {
            progressInput.value = 100;
          }
          readyInput.value = true;
        } catch (_) {
          return false;
        }
        stopTicker();
        scheduleRemoval();
        try {
          window.__bootTimes.liftFired = performance.now();
        } catch (_) {
          // Ignore.
        }
        return true;
      }

      // Called by the flutter-first-frame listener. Returns true when Rive
      // owns the handover (lift plays, removal happens after it completes),
      // false when Rive failed and the caller should remove immediately.
      window.__bootRiveDone = function () {
        if (failed || !instance) {
          return false;
        }
        if (loaded && readyInput) {
          return fireLift();
        }
        // Rive is still loading: record the request so onLoad fires the
        // lift instead of cutting to the app.
        flutterFired = true;
        return true;
      };

      function resize() {
        try {
          if (instance && instance.resizeDrawingSurfaceToCanvas) {
            instance.resizeDrawingSurfaceToCanvas();
          }
        } catch (_) {
          // Ignore.
        }
      }

      // prefers-reduced-motion: never start Rive; show the static fallback.
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          showFallback();
          return;
        }
        if (!window.WebAssembly || !canvas.getContext) {
          showFallback();
          return;
        }
      } catch (_) {
        showFallback();
        return;
      }

      function init() {
        if (loaded || failed) {
          return;
        }
        var runtime = window.rive;
        if (!runtime || !runtime.Rive) {
          fail();
          return;
        }
        // Same-origin WASM: the runtime defaults to fetching rive.wasm from
        // a CDN (~400 ms cold); vendored docs/web/rive.wasm loads in a few
        // ms on the same origin so the flock paints on first paint.
        try {
          if (runtime.RuntimeLoader && runtime.RuntimeLoader.setWasmUrl) {
            runtime.RuntimeLoader.setWasmUrl('rive.wasm');
          }
        } catch (_) {
          // Ignore; the CDN default still works, just slower.
        }
        try {
          instance = new runtime.Rive({
            src: 'boot.riv',
            artboard: artboard(),
            stateMachine: 'boot',
            canvas: canvas,
            autoplay: true,
            layout: new runtime.Layout({ fit: 'cover', alignment: 'center' }),
            onLoad: function () {
              if (loaded || failed) {
                return;
              }
              try {
                var inputs = instance.stateMachineInputs('boot') || [];
                for (var i = 0; i < inputs.length; i++) {
                  if (inputs[i].name === 'progress') {
                    progressInput = inputs[i];
                  } else if (inputs[i].name === 'ready') {
                    readyInput = inputs[i];
                  }
                }
              } catch (_) {
                progressInput = null;
                readyInput = null;
              }
              if (!readyInput) {
                fail();
                return;
              }
              loaded = true;
              try {
                window.__bootTimes.riveLoaded = performance.now();
              } catch (_) {
                // Ignore.
              }
              try {
                if (instance.resizeDrawingSurfaceToCanvas) {
                  instance.resizeDrawingSurfaceToCanvas();
                }
              } catch (_) {
                // Ignore; canvas still draws at its attribute size.
              }
              startTicker();
              try {
                window.requestAnimationFrame(function () {
                  try {
                    window.__bootTimes.firstFrame = performance.now();
                  } catch (_) {
                    // Ignore.

              } catch (_) {

              }
            },
            onLoadError: function () {

            },
          });

            window.addEventListener('resize', resize);
          } catch (_) {

          }
        } catch (_) {
          fail();
        }
      }

      window.setTimeout(function () {
        if (!loaded && !failed) {

        }
      }, TIMEOUT_MS);

    })();
