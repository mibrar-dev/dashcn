          weight: 800
        - asset: assets/fonts/Geist-BlackItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/Geist-Bold.otf
          weight: 700
        - asset: assets/fonts/Geist-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Geist-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/Geist-Light.otf
          weight: 300
        - asset: assets/fonts/Geist-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Geist-Medium.otf
          weight: 500
        - asset: assets/fonts/Geist-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Geist-Regular.otf
          weight: 400
        - asset: assets/fonts/Geist-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Geist-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Geist-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Geist-Thin.otf
          weight: 100
        - asset: assets/fonts/Geist-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/Geist-UltraBlack.otf
          weight: 900
        - asset: assets/fonts/Geist-UltraLight.otf
          weight: 200
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Black.otf
          weight: 800
        - asset: assets/fonts/GeistMono-BlackItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/GeistMono-Bold.otf
          weight: 700
        - asset: assets/fonts/GeistMono-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/GeistMono-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/GeistMono-Italic.otf
          style: italic
        - asset: assets/fonts/GeistMono-Light.otf
          weight: 300
        - asset: assets/fonts/GeistMono-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/GeistMono-Medium.otf
          weight: 500
        - asset: assets/fonts/GeistMono-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/GeistMono-Regular.otf
          weight: 400
        - asset: assets/fonts/GeistMono-SemiBold.otf
          weight: 600
        - asset: assets/fonts/GeistMono-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/GeistMono-Thin.otf
          weight: 100
        - asset: assets/fonts/GeistMono-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/GeistMono-UltraBlack.otf
          weight: 900
        - asset: assets/fonts/GeistMono-UltraLight.otf
          weight: 200
    # Theme Studio font rows (P7-TS1): the OFL families the Heading / Body /
    # Mono pickers offer, declared so the files exist in a `flutter run`, in a
    # compiled bundle and inside tests. Family names are the canonical
    # (spaced) names — they must match `TextStyle.fontFamily` and the
    # `ThemeDocument` font slots exactly (see lib/theme/docs_fonts.dart).
    # Switching loads only the picked family through `FontLoader`, so a
    # switch never pays for the whole catalogue.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
