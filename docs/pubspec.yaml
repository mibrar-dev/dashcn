# Docs app for dashcn (Flutter web, GitHub Pages).
#
# Dependency policy (P6 docs rebuild):
#  * Widgets-only: nothing here may pull `material.dart` / `cupertino.dart`
#    into the app; the `grep -rnE` gate in CI enforces it.
#  * Registry components are NOT pubspec dependencies: they are copied into
#    `lib/ui/dashcn/` by the CLI (`dashcn init` + `add --all`).
#    `tool/sync_registry.sh` mirrors the registry tree the same way.
#  * Every dependency below has a one-line justification. Re-adding a removed
#    dep (go_router, syntax_highlight, shared_preferences, font_awesome, …)
#    requires the same.

name: docs
description: Flutter web docs for dashcn, built on the post-cutover registry.
publish_to: none
version: 1.0.0+1

environment:
  # One SDK floor for the whole kit: the registry's newest language feature is
  # `private-named-parameters` (shipped in Dart 3.12.0). The mirrored registry
  # sources under lib/ui/dashcn carry no per-library `// @dart=` pins, so this
  # package's floor is what every installed component compiles against.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # The registry `app` component installs ComponentLocalizations and
  # GlobalWidgetsLocalizations; without this the shell cannot compile.
  flutter_localizations:
    sdk: flutter
  # Used by registry localizations / previews; flutter_localizations pins the
  # version, `any` avoids skew.
  intl: any
  # web_bridge: DOM custom events, localStorage persistence and the
  # prefers-reduced-motion probe — web only, via conditional import. Chosen
  # over shared_preferences so the app stays plugin-free.
  web: ^1.1.1
  # `components/formatter/formatter.dart` imports it; pure Dart, no widgets.
  expressions: ^0.2.5+2
  # Mirrors the kit dep for `ui/dashcn/theme/interop/preset_codec.dart`
  # (synced Dart mirror): same pure-Dart DEFLATE, encode/decode only.
  archive: ^4.0.0
  # `components/qr_code/qr_code_matrix.dart` imports it; pure Dart, no
  # Flutter/material import (deps: meta only).
  qr: ^4.0.0
  # device_preview: draws the P9-1 device bodies (iPhone / Galaxy / iPad /
  # desktop windows) around framed previews via `DevicePreviewFrame`. Only
  # `device_preview.dart` + `presets.dart` are imported (no binding, no
  # DevTools glue); the package itself is widgets-only (no material/cupertino
  # imports) and referenced presets tree-shake to ~16 KB gzip. Exact pin: the
  # frame SVG artwork is compiled const data, so upgrades change pixels.
  device_preview: 3.0.0
  # Media adapters only (`lib/media/`): the kit stays dependency-free, so the
  # `package:video_player` -> `VideoPlaybackController` bridge lives here.
  # Widgets-only plugin (Texture-based, no material/cupertino imports).
  video_player: ^2.14.1
  # Media adapters only (`lib/media/`): the `just_audio` -> `AudioPlaybackController`
  # bridge lives here. Pure-Dart audio playback (no widgets at all).
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only: docs/tool/gen_docs_data.dart parses registry sources with
  # `parseString`. Never shipped in main.dart.js.
  analyzer: ^14.0.0

flutter:
  # No `uses-material-design`: the kit is widgets-only; Material icons and
  # fonts are deliberately not bundled.
  fonts:
    - family: LucideIcons
      fonts:
        - asset: assets/fonts/lucide.ttf
    - family: RadixIcons
      fonts:
        - asset: assets/fonts/radix.otf
    - family: BootstrapIcons
      fonts:
        - asset: assets/fonts/bootstrap.otf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: GeistSans
      fonts:
